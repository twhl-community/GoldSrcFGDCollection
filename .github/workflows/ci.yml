name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Package release
      run: |
        cd ${{github.workspace}}
        zip -r goldsrcfgdcollection_${{github.event.release.tag_name}}.zip . -x .\* .\*/**
        gh release upload ${{github.event.release.tag_name}} goldsrcfgdcollection_${{github.event.release.tag_name}}.zip
      env:
        GITHUB_TOKEN: ${{ github.token }}
